name: Sync ZZZ raw IDs

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Automatic commit of ZZZ item IDs
        uses: actions/checkout@v4

      - name: Get ZZZ item IDs from EnkaNetwork/API-docs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p public/mapping/raw
          curl -sL -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/EnkaNetwork/API-docs/contents/store/zzz?ref=master" \
            | jq -r '.[] | select(.type=="file") | .download_url' \
            | while read url; do
                filename=$(basename "$url")
                curl -sL -o "public/mapping/raw/$filename" "$url"
              done

      - name: Get ZZZ tooltip data (PT/EN) from EnkaNetwork/API-docs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          fetch_files() {
            remote_path="$1"
            local_path="$2"
            mkdir -p "$local_path"

            curl -sL -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/EnkaNetwork/API-docs/contents/${remote_path}?ref=master" > /tmp/listing.json

            if ! jq -e 'type == "array"' /tmp/listing.json > /dev/null 2>&1; then
              echo "ERRO ao listar '$remote_path'. Resposta da API:"
              cat /tmp/listing.json
              exit 1
            fi

            jq -r '.[] | select(.type=="file") | .name + "|" + .download_url' /tmp/listing.json \
            | while IFS='|' read -r name url; do
                curl -sL -o "$local_path/$name" "$url"
              done
          }

          for lang in PT EN; do
            for sub in $(curl -sL -H "Authorization: token $GH_TOKEN" \
                         -H "Accept: application/vnd.github+json" \
                         "https://api.github.com/repos/EnkaNetwork/API-docs/contents/tooltip-data/zzz/${lang}?ref=master" \
                         | jq -r '.[] | select(.type=="dir") | .name'); do
              fetch_files "tooltip-data/zzz/${lang}/${sub}" "public/mapping/tools/${lang}/${sub}"
            done
          done
          
      - name: Sync Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/mapping/raw public/mapping/tools
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: auto changes"
            git push
          fi
